# Agent 并发和默认子模型；合并这些键，保留部署者的主模型、提供方、路径与身份。
# Merge agent defaults without replacing the root model, providers, paths, or identity.
[agents]
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"
enabled = true
max_concurrent_threads_per_session = 4
interrupt_message = true
