name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python gate and public package tests
        run: python -B -m unittest discover -s tests
      - name: Workflow Skill tests
        run: python -B -m unittest discover -s skills/design-evidence-led-agent-workflow/tests
      - name: R10 policy tests
        shell: powershell
        run: |
          .\tests\Test-RouterPolicyR10.ps1
          .\tests\Test-RetiredProviderRouting.ps1
          .\tests\Test-R10AuthorizationTiming.ps1
          .\tests\Test-BilingualParity.ps1
